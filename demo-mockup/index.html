<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Dependency Repair Pipeline &mdash; Recorded Trace Viewer</title>
  <script>
    /* Apply the stored theme before first paint. ?theme=light|dark forces one,
       which keeps figure capture deterministic. */
    (function () {
      try {
        var forced = new URLSearchParams(window.location.search).get("theme");
        var stored = localStorage.getItem("pipeline-demo-theme");
        var theme = (forced === "light" || forced === "dark") ? forced
          : stored || ((window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches) ? "dark" : "light");
        document.documentElement.setAttribute("data-theme", theme);
      } catch (e) {}
    })();
  </script>
  <link rel="stylesheet" href="css/pipeline.css" />
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <div>
        <h1>Dependency Repair Pipeline &mdash; Recorded Trace Viewer</h1>
        <div class="sub">Static visualisation of stored evaluation artefacts. No repair is executed here.</div>
      </div>
      <div class="topbar-actions">
        <a class="btn" href="#/records">Record list</a>
        <button class="btn" id="theme-toggle" type="button">Theme</button>
      </div>
    </div>
  </header>

  <main class="wrap" id="view"></main>

  <!-- Generated by demo-mockup/build_pipeline_demo_data.py from the stored run.
       See demo-mockup/README.md for provenance. -->
  <script src="data/pipeline_demo.js"></script>
  <script src="js/pipeline-demo.js"></script>
</body>
</html>
