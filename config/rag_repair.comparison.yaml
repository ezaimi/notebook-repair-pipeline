# Frozen configuration for the thesis-side member of the PLLM-style paired
# comparison.  It retains the production repair settings but closes PyPI
# network access and reads exactly the shared raw evidence snapshot.
runtime:
  python_version: "3.10"

pypi_client:
  frozen_cache_path: "data/pllm-style-baseline/shared-comparison-pypi-cache.json"
  allow_network: false
  rate_limit:
    min_request_interval_seconds: 0
    max_retries_on_429: 0
    max_retry_after_seconds: 0

repair_agent:
  ollama:
    url: "http://localhost:11434/api/generate"
    model: "gemma2:9b"
    temperature: 0.1
    top_p: 0.9
    max_tokens: 700
    timeout_seconds: 300

  prompt:
    template: "dependency_repair_v1"
    version: "i4_prompt_v1"

  retry:
    max_retries: 1
    retry_on:
      - invalid_json
      - schema_validation_error
      - grounding_validation_error
      - timeout
      - model_unavailable

  output:
    path: "data/repair-proposals/repair_proposals.jsonl"
    schema: "schemas/repair_proposal.schema.json"
